<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0B0E11"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 表壳 -->
  <circle cx="200" cy="200" r="198" fill="#15181D"/>
  <circle cx="200" cy="200" r="188" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="186" fill="none" stroke="#2A303A" stroke-width="2"/>

  <!-- 底环 -->
  <circle cx="200" cy="200" r="110" fill="none" stroke="#262B33" stroke-width="22"/>

  <!-- 充值 75%：黄色弧（0° → 270°） -->
  <path d="M 200 90 A 110 110 0 1 1 90 200"
        fill="none" stroke="#FCD535" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <!-- 赠送 25%：紫色弧（279° → 351°） -->
  <path d="M 91.4 182.8 A 110 110 0 0 1 182.8 91.4"
        fill="none" stroke="#9B8CFF" stroke-width="22" stroke-linecap="round"/>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <!-- 顶部标题 -->
    <text x="200" y="54" fill="#848E9C" font-size="14" font-weight="500">DeepSeek 余额</text>

    <!-- 环心 -->
    <text x="200" y="163" fill="#848E9C" font-size="14">总余额</text>
    <text x="200" y="212" fill="#EAECEF" font-size="44" font-weight="700">¥12.40</text>
    <text x="200" y="238" fill="#2EBD85" font-size="13">● 可用</text>
    <text x="200" y="256" fill="#848E9C" font-size="11">23:56 更新</text>

    <!-- 底部图例 -->
    <g font-size="12">
      <circle cx="146" cy="330" r="4" fill="#FCD535"/>
      <text x="158" y="334" fill="#848E9C" text-anchor="start">充值</text>
      <text x="252" y="334" fill="#EAECEF" text-anchor="end" font-weight="500">¥9.30</text>

      <circle cx="146" cy="356" r="4" fill="#9B8CFF"/>
      <text x="158" y="360" fill="#848E9C" text-anchor="start">赠送</text>
      <text x="252" y="360" fill="#EAECEF" text-anchor="end" font-weight="500">¥3.10</text>
    </g>
  </g>
</svg>
